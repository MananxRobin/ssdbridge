<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>SSDBridge</title>

    <!-- Dark mode FOUC prevention — must run before first paint -->
    <script>
      (function(){const t=localStorage.getItem('ssdb-theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.setAttribute('data-theme','dark');}})();
    </script>

    <!-- Inter Font (non-blocking — falls back to system font if offline) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        as="style" onload="this.onload=null;this.rel='stylesheet'" crossorigin>
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    </noscript>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div id="app"></div>
    <script src="/app.js"></script>
</body>

</html>
